name: '✔ Checklist'
on:
    pull_request:
        types: [ opened, edited, synchronize ]

jobs:
    pr-checklist:
        if: github.event.pull_request.draft == false
        permissions: read-all
        runs-on: ubuntu-latest
        steps:
            -   uses: mheap/require-checklist-action@v2
                with:
                    requireChecklist: false